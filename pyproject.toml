[project]
name = "py-code-health"
version = "0.1.0"
description = "Standalone, zero-dependency deterministic Python AST & Git code health analyzer and scorecard generator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
